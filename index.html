<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/fyrlinc-logo.png" />
        <link rel="apple-touch-icon" href="/fyrlinc-logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
        <title>Fyrlinc - Fire Alarm Panel Monitoring</title>
        <meta
            name="description"
            content="IoT Fire Alarm Panel Monitoring System - Real-time monitoring of all connected fire alarm panels"
        />
        <meta
            property="og:title"
            content="Fyrlinc - Fire Alarm Panel Monitoring"
        />
        <meta
            property="og:description"
            content="IoT Fire Alarm Panel Monitoring System"
        />
        <meta name="theme-color" content="#111214" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Fyrlinc" />
        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            onload="
                this.onload = null;
                this.rel = 'stylesheet';
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            />
        </noscript>
    </head>
    <body class="bg-[var(--surface-base)]">
        <div id="root">
            <style>
                .initial-loader-container {
                    display: flex;
                    height: 100vh;
                    width: 100vw;
                    align-items: center;
                    justify-content: center;
                    background-color: #111214;
                }
                .initial-loader {
                    width: 40px;
                    height: 40px;
                    border: 3px solid rgba(30, 107, 138, 0.2);
                    border-top-color: #1e6b8a;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                }
                @keyframes spin {
                    to {
                        transform: rotate(360deg);
                    }
                }
            </style>
            <div class="initial-loader-container">
                <div class="initial-loader"></div>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
