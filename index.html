<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/fyrlinc-logo.png" />
        <link rel="apple-touch-icon" href="/fyrlinc-logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fyrlinc - Fire Alarm Panel Monitoring</title>
        <meta
            name="description"
            content="IoT Fire Alarm Panel Monitoring System - Real-time monitoring of all connected fire alarm panels"
        />
        <meta
            property="og:title"
            content="Fyrlinc - Fire Alarm Panel Monitoring"
        />
        <meta
            property="og:description"
            content="IoT Fire Alarm Panel Monitoring System"
        />
        <meta name="theme-color" content="#0a0a0a" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Fyrlinc" />
        <!-- Google Fonts: Inter (body) + Space Grotesk (display) + Barlow Condensed -->
        <!-- Preconnect so DNS/TCP is ready before the font CSS is requested -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Non-blocking font load: preload the stylesheet, then apply it once
         downloaded. This removes the render-blocking penalty entirely.
         The service worker (Workbox CacheFirst) caches both the CSS and the
         woff2 files so repeat visits are served with zero network latency.
         Outfit removed — it was marked legacy and is unused. -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
            onload="
                this.onload = null;
                this.rel = 'stylesheet';
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
            />
        </noscript>
    </head>
    <body class="bg-[#0f0f0e]">
        <div id="root">
            <style>
                .initial-loader-container {
                    display: flex;
                    height: 100vh;
                    width: 100vw;
                    align-items: center;
                    justify-content: center;
                    background-color: #0f0f0e;
                }
                .initial-loader {
                    width: 40px;
                    height: 40px;
                    border: 3px solid rgba(245, 158, 11, 0.2);
                    border-top-color: #f59e0b;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                }
                @keyframes spin {
                    to {
                        transform: rotate(360deg);
                    }
                }
            </style>
            <div class="initial-loader-container">
                <div class="initial-loader"></div>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
