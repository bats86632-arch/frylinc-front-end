name: Build Android App (.aab & .apk)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Upload Keystore (if secret provided)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Build Android App Bundle (.aab) & Release APK (.apk)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'fyrlinc2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'fyrlinc-upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'fyrlinc2026' }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease assembleDebug

      - name: Organize Binaries
        run: |
          mkdir -p release-builds
          cp android/app/build/outputs/bundle/release/app-release.aab release-builds/Fyrlinc-PlayStore.aab || true
          cp android/app/build/outputs/apk/release/app-release.apk release-builds/Fyrlinc-Release.apk || true
          cp android/app/build/outputs/apk/debug/app-debug.apk release-builds/Fyrlinc-Debug.apk || true

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fyrlinc-Android-Binaries
          path: release-builds/
          retention-days: 14
